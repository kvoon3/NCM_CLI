name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ncm-macos-aarch64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ncm-macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ncm-windows-x86_64
            ext: ".exe"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: ncm-linux-x86_64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ncm${{ matrix.ext }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ncm-macos-aarch64/ncm
            ncm-macos-x86_64/ncm
            ncm-windows-x86_64/ncm.exe
            ncm-linux-x86_64/ncm
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}