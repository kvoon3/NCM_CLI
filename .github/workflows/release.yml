name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ncm-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ncm-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ncm-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: ncm-linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ncm${{ matrix.os == 'windows-latest' && '.exe' || '' }}