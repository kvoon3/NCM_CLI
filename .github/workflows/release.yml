name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ncm-macos-aarch64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ncm-macos-x86_64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ncm-windows-x86_64
            ext: ".exe"
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: ncm-linux-x86_64
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: |
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/ncm${{ matrix.ext }} ncm-${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ncm-${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download ncm-macos-aarch64
        uses: actions/download-artifact@v4
        with:
          name: ncm-macos-aarch64
          path: artifacts/ncm-macos-aarch64

      - name: Download ncm-macos-x86_64
        uses: actions/download-artifact@v4
        with:
          name: ncm-macos-x86_64
          path: artifacts/ncm-macos-x86_64

      - name: Download ncm-windows-x86_64
        uses: actions/download-artifact@v4
        with:
          name: ncm-windows-x86_64
          path: artifacts/ncm-windows-x86_64

      - name: Download ncm-linux-x86_64
        uses: actions/download-artifact@v4
        with:
          name: ncm-linux-x86_64
          path: artifacts/ncm-linux-x86_64

      - name: Make executables
        run: |
          chmod +x artifacts/ncm-macos-aarch64/ncm
          chmod +x artifacts/ncm-macos-x86_64/ncm
          chmod +x artifacts/ncm-linux-x86_64/ncm

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/ncm-macos-aarch64/ncm-macos-aarch64
            artifacts/ncm-macos-x86_64/ncm-macos-x86_64
            artifacts/ncm-windows-x86_64/ncm-windows-x86_64.exe
            artifacts/ncm-linux-x86_64/ncm-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}