name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: linux-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/ncm

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Rename for release
        run: |
          mv artifacts/macos-aarch64/ncm ncm-macos-aarch64
          mv artifacts/macos-x86_64/ncm ncm-macos-x86_64
          mv artifacts/windows-x86_64/ncm ncm-windows-x86_64.exe
          mv artifacts/linux-x86_64/ncm ncm-linux-x86_64
          chmod +x ncm-macos-aarch64 ncm-macos-x86_64 ncm-linux-x86_64

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ncm-macos-aarch64
            ncm-macos-x86_64
            ncm-windows-x86_64.exe
            ncm-linux-x86_64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
